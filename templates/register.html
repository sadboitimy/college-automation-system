{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Регистрация</h4>
            </div>
            <div class="card-body">
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">ФИО</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="form-label">Дата рождения</label>
                        <input type="date" name="date_of_birth" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password1" class="form-control" required>
                        <small class="text-muted">Минимум 8 символов</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Повторите пароль</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}">Уже есть аккаунт? Войти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dobInput = document.getElementById('date_of_birth');
    const today = new Date().toISOString().split('T')[0];
    
    // Устанавливаем максимальную дату (сегодня)
    dobInput.max = today;
    
    // Устанавливаем минимальную дату (100 лет назад)
    const minDate = new Date();
    minDate.setFullYear(minDate.getFullYear() - 100);
    dobInput.min = minDate.toISOString().split('T')[0];
});
</script>
